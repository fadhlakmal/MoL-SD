# Single-task conditional baseline, SD3 rectified-flow objective.
# Every available key (with defaults) is in sd/config.py; unknown keys are rejected.
experiment_name: "tes-default"
output_dir: "runs"
seed: 42

model:
  in_channels: 8  # noisy latent + condition latent

objective:
  type: flow_matching  # or: epsilon
  timestep_sampling: logit_normal
  shift: 1.0

data:
  size: 512
  batch_size: 1
  prompts_file: "data/prompts.txt"
  prompt_dropout: 0.1
  tasks:
    canny:
      weight: 1.0
      target_dir: "data/canny/targets"
      cond_dir: "data/canny/conditions"

training:
  max_steps: 10000
  learning_rate: 5.0e-5
  warmup_steps: 500
  weight_decay: 1.0e-2
  grad_accum: 4
  save_every: 1000
  val_every: 500

sampling:
  steps: 28
  cfg_scale: 5.0
