# Single-task conditional baseline.
# Schema and defaults: molsd/config.py (unknown keys are rejected).
# `defaults` entries are files under configs/, merged in order; keys below override them.
defaults:
  - objective/flow_matching
  - tasks/canny

experiment_name: "tes-default"
output_dir: "runs"
seed: 42

model:
  in_channels: 8  # noisy latent + condition latent

data:
  size: 512
  batch_size: 1
  prompts_file: "data/prompts.txt"
  prompt_dropout: 0.1

training:
  max_steps: 10000
  learning_rate: 5.0e-5
  warmup_steps: 500
  weight_decay: 1.0e-2
  grad_accum: 4
  save_every: 1000
  val_every: 500
