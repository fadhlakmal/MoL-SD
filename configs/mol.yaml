# Multi-task conditional training. Task losses are combined by Trainer.combine_losses (weighted sum by default).
experiment_name: "tes-mol"
output_dir: "runs"
seed: 42

model:
  in_channels: 8

objective:
  type: flow_matching
  timestep_sampling: logit_normal
  shift: 1.0

data:
  size: 512
  batch_size: 1
  prompts_file: "data/prompts.txt"
  prompt_dropout: 0.1
  tasks:
    canny:
      weight: 0.2
      target_dir: "data/canny/targets"
      cond_dir: "data/canny/conditions"
    depth:
      weight: 0.8
      target_dir: "data/canny/targets"  # TODO: point at real depth data
      cond_dir: "data/canny/conditions"

training:
  max_steps: 10000
  learning_rate: 5.0e-5
  warmup_steps: 500
  weight_decay: 1.0e-2
  grad_accum: 4
  save_every: 1000
  val_every: 500

sampling:
  steps: 28
  cfg_scale: 5.0
