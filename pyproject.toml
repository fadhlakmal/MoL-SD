[project]
name = "mol-sd"
version = "0.1.0"
description = "SD1.5 UNet trained with the SD3 rectified-flow recipe, with image conditioning and multi-task training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.49.2",
    "datasets>=2.19.1",
    "diffusers>=0.37.1",
    "numpy>=1.26",
    "omegaconf>=2.3.1",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "safetensors>=0.7.0",
    "scikit-image>=0.24",
    "timm>=1.0.27",
    "tokenizers>=0.22.2",
    "torch>=2.8.0",
    "torchmetrics[image]>=1.4",
    "torchvision>=0.23.0",
    "tqdm>=4.66",
    "transformers>=5.10.1",
    "wandb>=0.27.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["weights: needs converted SD1.5 weights in weights/ (skipped when missing)"]
addopts = "-m 'not weights'"
